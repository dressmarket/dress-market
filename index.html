<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dress Market - Современный магазин одежды</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="logo">Dress Market</div>
            <div class="nav-links">
                <a href="#catalog">Каталог</a>
                <a href="#about">О нас</a>
                <a href="mailto:akfagia@gmail.com" class="contact-btn">Обратная связь</a>
                <button id="themeToggle" class="theme-toggle-btn" title="Сменить тему">
                    <span class="theme-icon">🌙</span>
                </button>
                <button id="authBtn" class="auth-btn">Войти</button>
            </div>
        </div>
    </nav>

    <section class="hero">
        <div class="hero-content">
            <h1>Dress Market</h1>
            <p>Лучший интернет магазин для сферы игр и одежды</p>
            <div class="platform-buttons">
                <a href="https://funpay.com/users/13881930/" target="_blank" class="platform-btn">
                    <span class="btn-icon">🎮</span>
                    <span class="btn-text">FunPay</span>
                </a>
                <a href="https://www.avito.ru/user/b0d4c38f5ccfec86b10c8bb726858ef0/profile" target="_blank" class="platform-btn">
                    <span class="btn-icon">🛍️</span>
                    <span class="btn-text">Avito</span>
                </a>
            </div>
        </div>
    </section>

    <section id="catalog" class="catalog">
        <div class="container">
            <div class="products-grid" id="productsGrid">
                <!-- Товары будут добавляться динамически -->
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p><a href="oferta.html" style="color: #667eea; text-decoration: underline;">Оферта</a></p>
                <p>Email: <a href="mailto:akfagia@gmail.com" style="color: #667eea; text-decoration: underline;">akfagia@gmail.com</a></p>
                <p>© 2026 Dress Market. Владелец: vkesi. Все права защищены.</p>
            </div>
        </div>
    </footer>

    <script type="module" src="app.js"></script>

    <!-- Модальное окно входа/регистрации -->
    <div id="authModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2 id="modalTitle">Вход в аккаунт</h2>
            <div class="auth-tabs">
                <button class="tab-btn active" data-tab="login">Вход</button>
                <button class="tab-btn" data-tab="register">Регистрация</button>
            </div>
            
            <!-- Вход через соцсети -->
            <div class="social-auth">
                <button id="googleSignIn" class="social-btn google-btn">
                    <svg class="social-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                    </svg>
                    <span>Войти через Google</span>
                </button>
                <button id="microsoftSignIn" class="social-btn microsoft-btn">
                    <svg class="social-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path fill="#f25022" d="M1 1h10v10H1z"/>
                        <path fill="#00a4ef" d="M13 1h10v10H13z"/>
                        <path fill="#7fba00" d="M1 13h10v10H1z"/>
                        <path fill="#ffb900" d="M13 13h10v10H13z"/>
                    </svg>
                    <span>Войти через Microsoft</span>
                </button>
                <button id="phoneSignIn" class="social-btn phone-btn">
                    <svg class="social-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="currentColor">
                        <path d="M17 1.01L7 1c-1.1 0-2 .9-2 2v18c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V3c0-1.1-.9-1.99-2-1.99zM17 19H7V5h10v14z"/>
                    </svg>
                    <span>Войти по телефону</span>
                </button>
            </div>

            <!-- Форма входа по телефону -->
            <div id="phoneAuthSection" style="display: none;">
                <input type="tel" id="phoneNumber" placeholder="+79991234567" />
                <div id="recaptcha-container"></div>
                <button id="sendCode" type="button" class="submit-btn">Отправить код</button>
                <div id="codeSection" style="display: none; margin-top: 1rem;">
                    <input type="text" id="verificationCode" placeholder="Код из SMS" />
                    <button id="verifyCode" type="button" class="submit-btn">Подтвердить</button>
                </div>
            </div>

            <div class="divider">
                <span>или</span>
            </div>

            <!-- Форма Email/Пароль -->
            <form id="authForm">
                <input type="email" id="email" placeholder="Email" required>
                <input type="password" id="password" placeholder="Пароль" required>
                <button type="submit" class="submit-btn">Войти</button>
            </form>
            <div id="authError" class="error-message"></div>
        </div>
    </div>

    <!-- Модальное окно профиля -->
    <div id="profileModal" class="modal">
        <div class="modal-content">
            <span class="close-profile">&times;</span>
            <h2>Профиль</h2>
            <div id="profileInfo">
                <p><strong>Имя:</strong> <span id="userName"></span></p>
                <p><strong>Email:</strong> <span id="userEmail"></span></p>
                <button id="logoutBtn" class="submit-btn">Выйти</button>
            </div>
        </div>
    </div>

</body>
</html>
